<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAHAYARAJ-2026</title>
    <!-- CSS கோப்பு இணைப்பு -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- கூகுள் சீட் சேமிக்கும்போது சுழலும் இண்டிகேட்டர் -->
    <div id="loading" class="hidden">சேமிக்கப் படுகிறது...</div>

    <div class="wrapper">
        <header>
            <span id="headerTitleText">SAHAYARAJ-2026</span>
            
            <!-- 'G' LED இண்டிகேட்டர் -->
            <div class="indicator-container">
                <div id="ledLight" class="g-led" title="Google Sheet Status">G</div>
            </div>
        </header>

        <!-- மெயின் திரை -->
        <div id="mainScreen">
            <!-- சர்ச் மற்றும் டேஷ்போர்டு பகுதிகள் இங்கே வரும் -->
        </div>

        <!-- யூசர் என்ட்ரி திரை -->
        <div id="userScreen" class="hidden">
            <!-- யூசர் விவரங்கள் இங்கே வரும் -->
        </div>
    </div>

    <!-- JS கோப்புகள் (வரிசை முக்கியம்) -->
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="logic.js"></script>
</body>
</html>
